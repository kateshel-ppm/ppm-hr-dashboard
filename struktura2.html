<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#F4F5F7;--card:#fff;--ink:#0F172A;--muted:#64748B;--micro:#94A3B8;--line:#E2E8F0;--accent:#2F6BFF;--accent-soft:#EEF3FF;
  --shadow:0 1px 2px rgba(15,23,42,.06),0 2px 8px rgba(15,23,42,.05);--shadow-h:0 6px 22px rgba(15,23,42,.13);--danger:#E0454B;--ok:#12B76A;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);height:100vh;overflow:hidden;display:flex;flex-direction:column}
.topbar{flex-shrink:0;background:#fff;border-bottom:1px solid var(--line);padding:9px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-size:15px;font-weight:800;letter-spacing:-.2px}.brand .a{color:var(--accent)}
.tabs{display:flex;gap:3px;background:#EEF0F3;border-radius:9px;padding:3px}
.tab{font-size:12px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:7px;text-decoration:none;white-space:nowrap}
.tab.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.who{font-size:11px;color:var(--micro);margin-left:auto}
.metrics{flex-shrink:0;display:flex;gap:10px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.mc{background:var(--bg);border-radius:10px;padding:8px 14px;min-width:118px}
.mc .l{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--micro)}
.mc .v{font-size:20px;font-weight:800;line-height:1.1;margin-top:2px}.mc .v .u{font-size:12px;color:var(--muted);font-weight:600}
.mc.warn .v{color:var(--danger)}
.toolbar{flex-shrink:0;display:flex;gap:8px;align-items:center;padding:9px 18px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.srch{position:relative}.srch input{width:230px;height:34px;border:1px solid var(--line);border-radius:9px;padding:0 12px 0 32px;font-family:inherit;font-size:13px;outline:none}
.srch input:focus{border-color:var(--accent)}.srch::before{content:"🔍";position:absolute;left:10px;top:8px;font-size:13px;opacity:.5}
.btn{height:34px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:0 13px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--bg)}.btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{height:34px;border:none;background:#fff;padding:0 13px;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--accent);color:#fff}
.chips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-left:4px}
.chip{font-size:11.5px;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:4px 11px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .c{opacity:.6;font-weight:700}
.stage{flex:1;position:relative;overflow:hidden;cursor:grab}.stage.pan{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
.edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.node{position:absolute;width:248px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line);transition:box-shadow .15s,transform .15s;cursor:default}
.node:hover{box-shadow:var(--shadow-h)}
.node.mgr{border-color:#D7E0EE}
.node.sel{box-shadow:0 0 0 2px var(--accent),var(--shadow-h)}
.node.dim{opacity:.32}
.node.hit{box-shadow:0 0 0 2px var(--ok),var(--shadow-h)}
.node::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:6px;border-radius:5px;background:var(--nc,#CBD5E1)}
.nbody{display:flex;gap:11px;padding:12px 13px 12px 16px;align-items:center}
.av{width:46px;height:46px;border-radius:11px;flex-shrink:0;background:#E8EDF4 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#7C90AC}
.ntx{flex:1;min-width:0}
.nrole{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nname{font-size:15px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;outline:none}
.nrole.edit:focus,.nname.edit:focus{background:var(--accent-soft);border-radius:4px;overflow:visible;white-space:normal}
.nmeta{display:flex;gap:6px;align-items:center;padding:0 13px 10px 16px;flex-wrap:wrap}
.pill{font-size:10.5px;font-weight:700;border-radius:20px;padding:3px 8px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.pill.team{background:#EFF4FB;color:#3B5C86}
.pill.tot{background:#F1F0FB;color:#5B4FB0}
.pill.vac{background:#FDECEC;color:var(--danger)}
.foot{border-top:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px;height:30px;font-size:11.5px;font-weight:700;user-select:none}
.fbtn{color:var(--accent);cursor:pointer;padding:2px 7px;border-radius:6px}.fbtn:hover{background:var(--accent-soft)}
.fbtn.sub{color:#64748B}.fbtn.sub:hover{background:#F1F5F9}
.fsep{color:var(--micro)}
.node.vac{border-style:dashed;border-color:#CBD5E1;background:#FAFBFC;box-shadow:none}
.node.vac::before{background:#CBD5E1}
.node.vac .av{background:#EEF1F5;color:#AAB4C2}
.node.vac .nname{color:var(--muted);font-weight:600}
.del{position:absolute;top:6px;right:8px;border:none;background:transparent;color:var(--micro);font-size:13px;cursor:pointer;opacity:0;border-radius:5px;line-height:1;padding:2px 4px}
.node:hover .del{opacity:1}.del:hover{background:#F1F5F9;color:var(--danger)}
.zone{position:absolute;border:1.5px solid;border-radius:20px;pointer-events:none}
.zlbl{position:absolute;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;display:flex;align-items:center;gap:7px}
.zlbl .zc{font-size:11px;font-weight:700;opacity:.7}
.zoomc{position:absolute;right:16px;bottom:16px;display:flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:11px;padding:5px 7px;box-shadow:var(--shadow);z-index:20}
.zoomc button{border:none;background:#F1F5F9;width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px;font-weight:700;color:var(--ink)}.zoomc button:hover{background:#E2E8F0}
.zoomc .zl{font-size:12px;font-weight:700;color:var(--muted);min-width:42px;text-align:center}
.legend{position:absolute;left:14px;top:14px;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:11px;padding:9px 11px;box-shadow:var(--shadow);z-index:10;font-size:12px}
.legend .lt{font-size:9.5px;font-weight:700;text-transform:uppercase;color:var(--micro);letter-spacing:.05em;margin-bottom:6px}
.legend .lr{display:flex;align-items:center;gap:7px;padding:2px 0;cursor:pointer;min-width:132px}
.legend .lr .ls{width:11px;height:11px;border-radius:3px;flex-shrink:0}
.legend .lr .lc{margin-left:auto;color:var(--micro);font-weight:700;padding-left:10px}
.legend .lr.off{opacity:.35}.legend .lr:hover{color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(244,245,247,.97);display:flex;align-items:center;justify-content:center;z-index:1000}
.gate{background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px 34px;box-shadow:var(--shadow-h);max-width:400px;text-align:center}
.gate h1{font-size:19px;margin-bottom:8px}.gate p{font-size:13px;color:var(--muted);margin-bottom:18px;line-height:1.5}
.empty{position:absolute;left:50%;top:80px;transform:translateX(-50%);text-align:center;color:var(--muted);font-size:14px}
.det{position:absolute;right:0;top:0;bottom:0;width:300px;background:#fff;border-left:1px solid var(--line);box-shadow:-4px 0 18px rgba(15,23,42,.06);transform:translateX(100%);transition:transform .2s;z-index:15;overflow-y:auto;padding:18px}
.det.open{transform:none}
.det .x{position:absolute;top:12px;right:14px;cursor:pointer;color:var(--micro);font-size:18px}
.det h3{font-size:17px;margin-bottom:2px}.det .dr{font-size:12px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin-bottom:14px}
.det .stat{display:flex;gap:10px;margin-bottom:16px}.det .stat .s{flex:1;background:var(--bg);border-radius:10px;padding:9px 11px}
.det .stat .s .n{font-size:19px;font-weight:800}.det .stat .s .l{font-size:10px;color:var(--micro);text-transform:uppercase;font-weight:600}
.det .sect{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--micro);letter-spacing:.04em;margin:6px 0 7px}
.det .rrow{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.det .rrow .ra{width:26px;height:26px;border-radius:7px;background:#E8EDF4;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#7C90AC}
.det .rrow .rn{font-weight:600;line-height:1.15}.det .rrow .rr{font-size:11px;color:var(--muted)}
.det .rrow.v .ra{background:#EEF1F5;color:#AAB4C2;border:1px dashed #CBD5E1}
</style>

/* ---- tree + rollups ---- */
function buildTree(){kids={};par={};for(const k in LINKS){const l=LINKS[k];if(l&&NODES[l.from]&&NODES[l.to]){(kids[l.from]=kids[l.from]||[]).push(l.to);par[l.to]=l.from;}}}

    roll[id]={demp,dvac,emp,vac};return roll[id];}
  rootIds().forEach(rec);return roll;}

function nh(id){return hasVisibleChildren(id)||roll[id]&&(roll[id].demp||roll[id].dvac)?NHc:(isVac(NODES[id])?NHe:NHe+20)}

function layout(){const POS={};
  function lay(id,x,y){const ch=vkidsOf(id);const H=nodeH(id);
    if(!ch.length){POS[id]={x,y,h:H};return{w:NW,h:H};}

    const cy=y+H+SUBGAP;let cx=x,bottom=cy;const ctr=[];

    POS[id]={x:(ctr[0]+ctr[ctr.length-1])/2-NW/2,y,h:H};return{w:Math.max(NW,cx-HGAP-x),h:bottom-y};}
  let rx=40;const rs=rootIds().filter(id=>!HID.has(id));rs.sort((a,b)=>((kids[b]||[]).length)-((kids[a]||[]).length));
  rs.forEach(r=>{const b=lay(r,rx,40);rx+=b.w+HGAP*2;});return POS;}

    const a=POS[p],b=POS[id],ah=nodeH(p),x1=a.x+NW/2,y1=a.y+ah,x2=b.x+NW/2,y2=b.y;
    // side-bus for stacked individuals (child within parent column), else elbow
    let d;if(b.x>=a.x-1&&b.x<=a.x+NW+1&&b.y>a.y+ah-1){const bx=a.x+18,cyc=b.y+nodeH(id)/2;d=`M${bx} ${y1} V${cyc} H${b.x}`;}
    else{const my=(y1+y2)/2;d=`M${x1} ${y1} V${my} H${x2} V${y2}`;}
    h+=`<path d="${d}" fill="none" stroke="#CBD5E1" stroke-width="1.6"/>`;});
  edges.innerHTML=h;sizeWorld();}
function sizeWorld(){let mx=0,my=0;Object.keys(POS).forEach(id=>{if(HID.has(id))return;mx=Math.max(mx,POS[id].x+NW);my=Math.max(my,POS[id].y+nodeH(id));});
  const W=mx+200,H=my+160;world.style.width=W+'px';world.style.height=H+'px';edges.setAttribute('width',W);edges.setAttribute('height',H);}
function renderZones(){let z=gid('zones');if(!z){z=document.createElement('div');z.id='zones';z.style.cssText='position:absolute;left:0;top:0;pointer-events:none';world.insertBefore(z,edges);}
  if(!showZones){z.innerHTML='';return;}
  const g={};Object.keys(POS).forEach(id=>{if(HID.has(id))return;const d=NODES[id].dept;if(!d||d==='—'||isVac(NODES[id]))return;(g[d]=g[d]||[]).push(id);});
  let h='',i=0;for(const d in g){const ids=g[d];if(ids.length<2)continue;let a=1e9,b=1e9,c=-1e9,e=-1e9;
    ids.forEach(id=>{a=Math.min(a,POS[id].x);b=Math.min(b,POS[id].y);c=Math.max(c,POS[id].x+NW);e=Math.max(e,POS[id].y+nodeH(id));});
    const col='#9AA3B0',P=18,L=30,x=a-P,y=b-P-L,w=c-a+P*2,ht=e-b+P*2+L,cnt=Object.values(NODES).filter(n=>n.dept===d&&!isVac(n)).length;i++;
    h+=`<div class="zone" style="left:${x}px;top:${y}px;width:${w}px;height:${ht}px;border-color:${col}55;background:${col}0d"></div>`+
       `<div class="zlbl" style="left:${x+14}px;top:${y+7}px;color:${col}">${esc(d)} <span class="zc">${cnt}</span></div>`;}
  z.innerHTML=h;}
function renderMetrics(){const ns=Object.values(NODES);const emp=ns.filter(n=>!isVac(n)).length,vac=ns.filter(isVac).length;
  const mgr=Object.keys(kids).filter(id=>(kids[id]||[]).some(c=>!isVac(NODES[c]))).length;
  let depth=0;function dd(id,l){depth=Math.max(depth,l);(kids[id]||[]).forEach(c=>dd(c,l+1));}rootIds().forEach(r=>dd(r,1));
  const spans=Object.keys(kids).map(id=>(kids[id]||[]).filter(c=>!isVac(NODES[c])).length).filter(x=>x>0);
  const avg=spans.length?(spans.reduce((a,b)=>a+b,0)/spans.length):0;
  const deps=new Set(ns.filter(n=>n.dept&&n.dept!=='—'&&!isVac(n)).map(n=>n.dept));
  gid('m-emp').innerHTML=emp;gid('m-mgr').innerHTML=mgr;gid('m-vac').innerHTML=vac;gid('m-lvl').innerHTML=depth;
  gid('m-span').innerHTML=avg.toFixed(1)+'<span class="u"> чел</span>';gid('m-dep').innerHTML=deps.size;}
function renderChips(){const c=gid('chips');const cnt={};Object.values(NODES).forEach(n=>{if(isVac(n)||!n.dept||n.dept==='—')return;cnt[n.dept]=(cnt[n.dept]||0)+1;});
  const arr=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
  c.innerHTML=arr.map(([d,n],i)=>`<span class="chip${filter===d?' on':''}" data-dep="${esc(d)}"><span class="dot" style="background:${dcolor(d,i)}"></span>${esc(d)} <span class="c">${n}</span></span>`).join('');
  c.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{filter=filter===ch.dataset.dep?null:ch.dataset.dep;renderChips();applyFilter();});}
function applyFilter(){const q=norm(gid('search').value);
  world.querySelectorAll('.node').forEach(el=>{const id=el.dataset.id,n=NODES[id];if(!n)return;el.classList.remove('dim','hit');let dim=false;
    if(filter&&!isVac(n)&&n.dept!==filter)dim=true;
    if(locFilter&&!isVac(n)&&locCat(n)!==locFilter)dim=true;
    if(q){const m=norm(n.title).includes(q)||norm(n.tag).includes(q);el.classList.toggle('hit',m);if(!m)dim=true;}
    if(dim)el.classList.add('dim');});}
function renderLegend(){const cnt={};Object.values(NODES).forEach(n=>{if(isVac(n))return;const k=locCat(n);cnt[k]=(cnt[k]||0)+1;});
  let h='<div class="lt">Локация · формат</div>';LOC.filter(l=>(cnt[l.k]||0)>0||l.k!=='Офис · др.').forEach(l=>{h+=`<div class="lr${locFilter&&locFilter!==l.k?' off':''}" data-loc="${esc(l.k)}"><span class="ls" style="background:${l.c}"></span>${esc(l.k)}<span class="lc">${cnt[l.k]||0}</span></div>`;});
  const lg=gid('legend');lg.innerHTML=h;lg.querySelectorAll('.lr').forEach(r=>r.onclick=()=>{locFilter=locFilter===r.dataset.loc?null:r.dataset.loc;renderLegend();applyFilter();});}

/* ---- interactions ---- */
function bindUI(){
  stage.addEventListener('mousedown',e=>{
    const act=e.target.closest('[data-act]'),node=e.target.closest('.node');
    if(act&&node){const id=node.dataset.id,a=act.dataset.act;
      if(a==='exp'||a==='col'){COL.has(id)?COL.delete(id):COL.add(id);saveCol();e.preventDefault();return rebuild();}
      if(a==='sub'||a==='subexp'){SUB.has(id)?SUB.delete(id):SUB.add(id);saveCol();e.preventDefault();return rebuild();}
      if(a==='del'){if(confirm('Скрыть блок? Вернётся после «↻ из ШТАТКИ».')){Object.keys(LINKS).forEach(lid=>{const l=LINKS[lid];if(l&&(l.from===id||l.to===id))delete LINKS[lid];});delete NODES[id];rebuild();}return;}}
    if(e.target.classList.contains('edit')){return;}
    if(node){sel=node.dataset.id;openDetail(sel);world.querySelectorAll('.node.sel').forEach(x=>x.classList.remove('sel'));node.classList.add('sel');e.preventDefault();return;}
    sel=null;closeDetail();world.querySelectorAll('.node.sel').forEach(x=>x.classList.remove('sel'));
    pan={x:e.clientX-panX,y:e.clientY-panY};stage.classList.add('pan');});
  window.addEventListener('mousemove',e=>{if(pan){panX=e.clientX-pan.x;panY=e.clientY-pan.y;applyView();}});
  window.addEventListener('mouseup',()=>{pan=null;stage.classList.remove('pan');});
  stage.addEventListener('wheel',e=>{e.preventDefault();const r=stage.getBoundingClientRect(),cx=e.clientX-r.left,cy=e.clientY-r.top,wx=(cx-panX)/scale,wy=(cy-panY)/scale,ns=Math.min(3,Math.max(.12,scale*(e.deltaY<0?1.12:.89)));panX=cx-wx*ns;panY=cy-wy*ns;scale=ns;applyView();},{passive:false});
  world.addEventListener('blur',e=>{const ed=e.target.closest('.edit');if(!ed)return;const node=e.target.closest('.node'),id=node.dataset.id,f=ed.dataset.f,val=ed.textContent.trim();if(NODES[id]&&NODES[id][f]!==val)NODES[id][f]=val;},true);
  gid('search').oninput=()=>applyFilter();
  gid('b-expand').onclick=()=>{COL=new Set();saveCol();rebuild();};
  gid('b-collapse').onclick=()=>{COL=new Set();for(const id in kids){if(hasKids(id))COL.add(id);}saveCol();rebuild();};
  gid('b-vac').onclick=()=>{showVac=!showVac;gid('b-vac').classList.toggle('on',showVac);rebuild();};
  gid('b-zones').onclick=()=>{showZones=!showZones;gid('b-zones').classList.toggle('on',showZones);renderZones();};
  gid('b-fit').onclick=fit;gid('zfit').onclick=fit;
  gid('zin').onclick=()=>zoomBy(1.2);gid('zout').onclick=()=>zoomBy(1/1.2);
  gid('v-tree').onclick=()=>setView('tree');gid('v-flat').onclick=()=>setView('flat');
  gid('b-seed').onclick=refreshFromFile;
  const zl=gid('zl');zl.addEventListener('keydown',e=>{if(e.key==='Enter'){const v=parseFloat(zl.value)||100;scale=Math.min(3,Math.max(.12,v/100));applyView();zl.blur();}});zl.addEventListener('mousedown',e=>e.stopPropagation());
}
let pan=null;
function applyView(){world.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;gid('zl').value=Math.round(scale*100);}
function zoomBy(f){const cx=stage.clientWidth/2,cy=stage.clientHeight/2,wx=(cx-panX)/scale,wy=(cy-panY)/scale,ns=Math.min(3,Math.max(.12,scale*f));panX=cx-wx*ns;panY=cy-wy*ns;scale=ns;applyView();}
function fit(){let a=1e9,b=1e9,c=-1e9,e=-1e9;Object.keys(POS).forEach(id=>{if(HID.has(id))return;a=Math.min(a,POS[id].x);b=Math.min(b,POS[id].y);c=Math.max(c,POS[id].x+NW);e=Math.max(e,POS[id].y+nodeH(id));});
  if(a>c)return;const cw=stage.clientWidth,ch=stage.clientHeight,bw=c-a+150,bh=e-b+150;scale=Math.min(1.1,Math.max(.12,Math.min(cw/bw,ch/bh)));panX=cw/2-((a+c)/2)*scale;panY=ch/2-((b+e)/2)*scale+10;applyView();}
function setView(v){view=v;gid('v-tree').classList.toggle('on',v==='tree');gid('v-flat').classList.toggle('on',v==='flat');
  if(v==='flat'){COL=new Set();for(const id in kids){if(hasKids(id))COL.add(id);}}else if(_cl){try{COL=new Set(JSON.parse(localStorage.getItem('struk2col')||'[]'))}catch(e){}}rebuild();}

/* ---- detail panel ---- */
function openDetail(id){const n=NODES[id],d=gid('det'),r=roll[id]||{demp:0,emp:0,vac:0};
  const dir=(kids[id]||[]);
  const rows=dir.map(c=>{const m=NODES[c],vac=isVac(m);return`<div class="rrow${vac?' v':''}"><div class="ra">${vac?'•':esc(initials(m.title))}</div><div><div class="rn">${esc(vac?'Вакансия':m.title)}</div><div class="rr">${esc(m.tag||'')}</div></div></div>`;}).join('')||'<div class="rr" style="color:var(--micro);padding:6px 0">Нет прямых подчинённых</div>';
  d.innerHTML=`<span class="x" onclick="closeDetail()">✕</span><h3>${esc(isVac(n)?'Вакансия':n.title)}</h3><div class="dr">${esc(n.tag||'')}</div>
    <div class="stat"><div class="s"><div class="n">${r.demp}</div><div class="l">прямых</div></div><div class="s"><div class="n">${r.emp}</div><div class="l">всего</div></div><div class="s"><div class="n" style="color:${r.vac?'var(--danger)':'inherit'}">${r.vac}</div><div class="l">вакансий</div></div></div>
    ${n.dept&&n.dept!=='—'?`<div class="sect">Отдел</div><div style="font-size:13px;font-weight:600;margin-bottom:14px">${esc(n.dept)}</div>`:''}
    <div class="sect">Прямые подчинённые (${dir.length})</div>${rows}`;
  d.classList.add('open');}
function closeDetail(){gid('det').classList.remove('open');sel=null;world.querySelectorAll('.node.sel').forEach(x=>x.classList.remove('sel'));}
window.closeDetail=closeDetail;

/* ---- seed from ШТАТКА (reuse builder from old tab structure) ---- */
function seed(){if(!confirm('Перестроить структуру из ШТАТКИ (133 чел. + вакансии)? Текущая схема будет заменена.'))return;
  fetch('org_structure.json?v='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(people=>{const {nodes,links}=buildOrg(people);
    nodesRef.set(nodes).then(()=>linksRef.set(links)).then(()=>{defaultCollapse();setTimeout(()=>{rebuild();fit();},400);});
  }).catch(()=>alert('Не удалось загрузить org_structure.json'));}
function isMgrTitle(r){return /руковод|директор|head|cpo|cfo|cmo|cto|тимлид|team lead|lead/i.test(r||'')}
function uid(){return 'n'+Math.random().toString(36).slice(2,9)}
function colorForSeed(p){if(p.vac)return '#CBD5E1';return DEPTC[p.udept]||'#CBD5E1';}
function buildOrg(people){const nodes={},links={},ids=new Map(),nameId={};
  const keyset=s=>{const w=norm(s).split(/\s+/).filter(Boolean);const o=[norm(s)];if(w.length>=2){o.push(w[0]+' '+w[1]);o.push(w[1]+' '+w[0]);}return o;};
  const findBoss=(b,self)=>{for(const k of keyset(b)){if(nameId[k]&&nameId[k]!==self)return nameId[k];}return null;};
  const gd=people.find(p=>!p.vac&&/^\s*генеральн\S*\s+директор/i.test(p.r));
  people.forEach(p=>{const id=uid();ids.set(p,id);if(!p.vac)keyset(p.n).forEach(k=>{if(!(k in nameId))nameId[k]=id;});
    nodes[id]={tag:p.r,title:p.vac?'Вакансия':p.n,dept:(p.udept||p.d||''),color:colorForSeed(p),vac:!!p.vac,fmt:p.fmt||'',city:p.city||'',photo:p.photo||null,x:0,y:0};});
  const gdId=ids.get(gd),byDept={};people.forEach(p=>{if(!p.vac)(byDept[p.d]=byDept[p.d]||[]).push(p)});
  const headOf={};Object.entries(byDept).forEach(([dept,mem])=>{headOf[dept]=mem.slice().sort((a,b)=>(isMgrTitle(b.r)?1:0)-(isMgrTitle(a.r)?1:0))[0];});
  people.forEach(p=>{const id=ids.get(p);let pa=null;const pb=p.boss?findBoss(p.boss,id):null;
    if(p===gd)pa=null;else if(pb)pa=pb;else{const h=headOf[p.d];pa=(h&&h!==p)?ids.get(h):gdId;}
    if(pa)links[uid()]={from:pa,to:id};});
  return{nodes,links};}
</script>
